# Full stack: Kafka + api + ai-agents + web + mobile (same services as `make start-all`).
# From repo root: `docker compose up --build` or `make docker-run-all`

name: serene-ai-assistant

services:
  kafka:
    image: apache/kafka:latest
    container_name: serene-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped
    networks:
      - internal

  ai-agents:
    build:
      context: ./ai-agents/app
      dockerfile: Dockerfile
    image: serene-ai-agents:local
    container_name: serene-ai-agents
    ports:
      - "8080:8080"
    env_file:
      - ./_common/.env
    environment:
      - KAFKA_BROKERS=kafka:29092
      - AI_AGENTS_HOST=0.0.0.0
      - AI_AGENTS_PORT=8080
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    image: serene-api:local
    container_name: serene-api
    ports:
      - "4000:4000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
      - KAFKA_BROKERS=kafka:29092
      - AI_AGENTS_BASE_URL=http://ai-agents:8080
    depends_on:
      kafka:
        condition: service_started
      ai-agents:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    image: serene-web:local
    container_name: serene-web
    ports:
      - "3000:3000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  mobile:
    build:
      context: .
      dockerfile: frontend/mobile/Dockerfile
      args:
        BACKEND_URL: http://localhost:4000
    image: serene-mobile:local
    container_name: serene-mobile
    ports:
      - "8100:8100"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://localhost:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - EXPO_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
