# Full stack: Kafka + api + ai-agents + web + mobile (same services as `make start-all`).
# All tunables come from `./_common/.env` — run `make docker-run-all` or:
#   docker compose --env-file ./_common/.env up -d --build

name: serene-ai-assistant

services:
  kafka:
    image: apache/kafka:latest
    container_name: serene-kafka
    ports:
      - "${DOCKER_KAFKA_PUBLISH_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: ${DOCKER_KAFKA_NODE_ID:-1}
      KAFKA_PROCESS_ROLES: ${DOCKER_KAFKA_PROCESS_ROLES:-broker,controller}
      KAFKA_LISTENERS: ${DOCKER_KAFKA_LISTENERS:-PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092}
      KAFKA_ADVERTISED_LISTENERS: ${DOCKER_KAFKA_ADVERTISED_LISTENERS:-PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${DOCKER_KAFKA_CONTROLLER_LISTENER_NAMES:-CONTROLLER}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${DOCKER_KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${DOCKER_KAFKA_INTER_BROKER_LISTENER_NAME:-PLAINTEXT}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${DOCKER_KAFKA_CONTROLLER_QUORUM_VOTERS:-1@localhost:9093}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${DOCKER_KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: ${DOCKER_KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:-0}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${DOCKER_KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:-1}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${DOCKER_KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:-1}
    restart: unless-stopped
    networks:
      - internal

  ai-agents:
    build:
      context: ./ai-agents/app
      dockerfile: Dockerfile
    image: serene-ai-agents:local
    container_name: serene-ai-agents
    ports:
      - "${AI_AGENTS_PORT:-8080}:8080"
    env_file:
      - ./_common/.env
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS_COMPOSE:-kafka:29092}
      AI_AGENTS_HOST: ${AI_AGENTS_HOST:-0.0.0.0}
      AI_AGENTS_PORT: ${AI_AGENTS_PORT:-8080}
    depends_on:
      - kafka
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AI_AGENTS_PORT:-8080}/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    image: serene-api:local
    container_name: serene-api
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    env_file:
      - ./_common/.env
    environment:
      NODE_ENV: ${NODE_ENV_COMPOSE:-production}
      KAFKA_BROKERS: ${KAFKA_BROKERS_COMPOSE:-kafka:29092}
      AI_AGENTS_BASE_URL: ${AI_AGENTS_BASE_URL_COMPOSE:-http://ai-agents:8080}
    depends_on:
      kafka:
        condition: service_started
      ai-agents:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:${BACKEND_PORT:-4000}/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    image: serene-web:local
    container_name: serene-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ./_common/.env
    environment:
      NODE_ENV: ${NODE_ENV_COMPOSE:-production}
      BACKEND_URL: ${WEB_SERVER_BACKEND_URL_COMPOSE:-http://api:4000}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  mobile:
    build:
      context: .
      dockerfile: frontend/mobile/Dockerfile
      args:
        BACKEND_URL: ${BACKEND_URL}
    image: serene-mobile:local
    container_name: serene-mobile
    ports:
      - "${MOBILE_PORT:-8100}:8100"
    env_file:
      - ./_common/.env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
