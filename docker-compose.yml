name: claude-architecture

services:
  web:
    build:
      context: ./frontend
      dockerfile: web/Dockerfile
    image: claude-arch/web:local
    container_name: claude-arch-web
    ports:
      - "3000:3000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  mobile:
    build:
      context: ./frontend
      dockerfile: mobile/Dockerfile
    image: claude-arch/mobile:local
    container_name: claude-arch-mobile
    ports:
      - "8100:8100"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://api:4000
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:4000
      - EXPO_PUBLIC_BACKEND_URL=http://localhost:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
    image: claude-arch/api:local
    container_name: claude-arch-api
    ports:
      - "4000:4000"
    env_file:
      - ./_common/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
