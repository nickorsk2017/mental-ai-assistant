[project]
name = "serene-ai-agents"
version = "0.1.0"
description = "Serene AI agent service (FastAPI, LangChain, OpenAI, Kafka)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "kafka-python>=2.0,<3",
  "httpx>=0.28.1",
  "pinecone>=5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
