name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/app/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: pnpm --dir backend/app install --frozen-lockfile

      - name: Install frontend workspace dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install AI agents dependencies (incl. dev)
        run: uv sync --directory ai-agents/app --group dev

      - name: Run CI checks
        run: make ci
