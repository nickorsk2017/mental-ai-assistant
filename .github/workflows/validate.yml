name: Validate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --dir backend/app

      - name: Install frontend workspace dependencies
        run: pnpm install --frozen-lockfile --dir frontend

      - name: Install AI agents dependencies (incl. dev)
        run: cd ai-agents/app && uv sync --group dev

      - name: Lint, tests, backend build, frontend typecheck
        run: make ci
